name: Sync upstream

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch and merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/railzen/nezha-zero.git 2>/dev/null ||
            git remote set-url upstream https://github.com/railzen/nezha-zero.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            git diff --name-only --diff-filter=U > "${RUNNER_TEMP}/upstream-conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          title="Upstream sync needs manual conflict resolution"
          gh label create upstream-sync \
            --color "B58900" \
            --description "Automated upstream synchronization needs attention" \
            --force
          if [ -z "$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')" ]; then
            {
              echo "The scheduled upstream sync could not merge \`railzen/nezha-zero:main\`."
              echo
              echo "Conflicting paths:"
              sed 's/^/- `/' "${RUNNER_TEMP}/upstream-conflicts.txt" | sed 's/$/`/'
              echo
              echo "No code was pushed. The Refined design and the current release remain unchanged."
            } > "${RUNNER_TEMP}/upstream-issue.md"
            gh issue create --title "$title" --body-file "${RUNNER_TEMP}/upstream-issue.md" --label upstream-sync
          fi
          exit 1

      # A failed publication is retried even when no newer upstream commit exists.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this revision needs an image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nezha-zero-refined
          SHORT_SHA: ${{ steps.merge.outputs.short_sha }}
          SOURCE_CHANGED: ${{ steps.merge.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SOURCE_CHANGED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.merge.outputs.changed == 'true' || steps.image.outputs.publish == 'true'
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify presentation boundary
        if: steps.merge.outputs.changed == 'true' || steps.image.outputs.publish == 'true'
        run: ./scripts/verify-refined-boundary.sh upstream/main

      - name: Test dashboard
        if: steps.merge.outputs.changed == 'true' || steps.image.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ""
        run: go test ./...

      - name: Build dashboard
        if: steps.merge.outputs.changed == 'true' || steps.image.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ""
        run: go build ./cmd/dashboard

      - name: Test agent compatibility
        if: steps.merge.outputs.changed == 'true' || steps.image.outputs.publish == 'true'
        working-directory: agent
        env:
          GITHUB_TOKEN: ""
        run: go test -skip TestCloudflareDetection ./...

      - name: Build smoke-test image
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/amd64
          load: true
          tags: nezha-zero-refined:smoke
          cache-from: type=gha

      - name: Smoke test image
        if: steps.image.outputs.publish == 'true'
        run: ./scripts/smoke-refined-image.sh nezha-zero-refined:smoke

      - name: Push verified upstream merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN do not start other push workflows.
      # Publish here so the image always follows a verified upstream merge.
      - uses: docker/setup-qemu-action@v4
        if: steps.image.outputs.publish == 'true'

      - name: Image metadata
        if: steps.image.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nezha-zero-refined
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.merge.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Nezha Zero Refined
            org.opencontainers.image.description=Upstream-compatible Nezha Zero with a soft, minimal presentation layer
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Publish verified image
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/amd64,linux/arm64,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report validation failure
        if: failure() && steps.merge.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          title="Upstream sync failed compatibility checks"
          gh label create upstream-sync \
            --color "B58900" \
            --description "Automated upstream synchronization needs attention" \
            --force
          if [ -z "$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')" ]; then
            gh issue create \
              --title "$title" \
              --body "An upstream boundary, test, source push, or image publication step failed. The last successfully published source and image remain safe to use. See workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --label upstream-sync
          fi
