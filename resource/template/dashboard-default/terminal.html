{{define "dashboard-default/terminal"}}
<!DOCTYPE html>
<html lang="{{.Conf.Language}}">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tty@{{.ServerName}} - {{.Title}}</title>
    <link rel="shortcut icon" type="image/png" href="{{if .Conf.Site.ConnectionLogoURL}}{{.Conf.Site.ConnectionLogoURL}}{{else if .Conf.Site.LogoURL}}{{.Conf.Site.LogoURL}}{{else}}/static/logo.svg?v20210804{{end}}" />
    <link type="text/css" rel="stylesheet" href="/static/cdn/xterm@5.5.0/css/xterm.css" />
    <link rel="stylesheet" type="text/css" href="/static/refined/refined.css?v20260729v" />
</head>
<style>
    html,
    body,
    #terminal-container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        display: block;
        overflow: hidden;
        background: #101010 !important;
        color: #f5f5f5 !important;
    }

    #terminal-container {
        box-sizing: border-box;
        overflow: hidden;
        background: #101010;
    }

    #file-list-iframe {
        position: absolute;
        top: 0;
        right: 0;
        width: clamp(320px, 34vw, 480px);
        max-width: 100vw;
        height: 100%;
        display: none;
        z-index: 10;
        box-sizing: border-box;
        border: 0;
        border-left: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px 0 0 16px;
        background: #f7f7f7;
        box-shadow: -16px 0 44px rgba(0, 0, 0, 0.28);
    }

    #folder-button {
        position: absolute;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 20;
        display: flex;
        width: 46px;
        height: 46px;
        margin: 0;
        padding: 0;
        justify-content: center;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 50%;
        background: #f4f4f4;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        color: #191919;
        cursor: pointer;
        font-size: 0;
        transition:
            background-color 180ms ease,
            transform 180ms ease;
    }

    #folder-button::before {
        width: 18px;
        height: 13px;
        box-sizing: border-box;
        border: 2px solid currentColor;
        border-radius: 3px;
        content: "";
        transform: translateY(2px);
    }

    #folder-button::after {
        position: absolute;
        top: 14px;
        left: 14px;
        width: 8px;
        height: 5px;
        box-sizing: border-box;
        border: 2px solid currentColor;
        border-bottom: 0;
        border-radius: 3px 3px 0 0;
        content: "";
    }

    #folder-button:hover {
        background: #ffffff;
        transform: translateY(-1px);
    }

    #folder-button:active {
        transform: translateY(0);
    }

    #folder-button:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.28) !important;
        outline-offset: 3px;
    }

    @media (max-width: 640px) {
        #file-list-iframe {
            width: min(92vw, 440px);
            border-radius: 14px 0 0 14px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        #folder-button {
            transition: none;
        }
    }
</style>

<body onresize="onResize()">
    <div id="terminal-container"></div>
    <iframe id="file-list-iframe" name="file-list-iframe" src=""></iframe>
    <button id="folder-button">📁</button>

    <script src="/static/cdn/xterm@5.5.0/lib/xterm.js"></script>
    <script src="/static/cdn/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script src="/static/cdn/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
    <script src="/static/cdn/@xterm/addon-attach@0.11.0/lib/addon-attach.js"></script>
    <script>
        let sendResizing = false;

        function doResize() {
            fitAddon.fit()

            const w = fitAddon.proposeDimensions();
            const prefix = new Int8Array([1]);
            const resizeMessage = new TextEncoder().encode(JSON.stringify({
                Rows: w.rows,
                Cols: w.cols,
            }));

            var msg = new Int8Array(prefix.length + resizeMessage.length);
            msg.set(prefix);
            msg.set(resizeMessage, prefix.length);

            socket.send(msg)
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function onResize() {
            if (sendResizing) return;
            sendResizing = true;
            try {
                await sleep(1500);
                doResize();
            } catch (error) {
                console.log('resize', error);
            } finally {
                sendResizing = false
            }
        }

        const term = new Terminal({
            screenKeys: true,
            useStyle: true,
            cursorBlink: true,
        });
        const socket = new WebSocket((window.location.protocol == 'https:' ? 'wss' : 'ws') + '://' + window.location.host + '/terminal/' + '{{.SessionID}}');

        const attachAddon = new AttachAddon.AttachAddon(socket);
        term.loadAddon(attachAddon);

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        term.open(document.getElementById('terminal-container'));

        socket.onopen = () => {
            onResize()
        }

        socket.onclose = () => {
            alert('{{tr "TerminalConnectionTimeOutOrSessionEnded"}}')
            window.close()
        }

        socket.onerror = () => {
            alert('{{tr "TerminalConnectionFailed"}}')
        }

        // 处理文件夹按钮点击事件
        const folderButton = document.getElementById('folder-button');
        const fileListIframe = document.getElementById('file-list-iframe');
        let fileListVisible = false;

        folderButton.addEventListener('click', () => {
            if (!fileListVisible) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/file';
                form.target = 'file-list-iframe';
                const idField = document.createElement('input');
                idField.type = 'hidden';
                idField.name = 'id';
                idField.value = '{{.ServerID}}';
                form.appendChild(idField);
                const csrfMatch = document.cookie.match(new RegExp('(^| )nz-csrf=([^;]+)'));
                const csrfToken = csrfMatch ? decodeURIComponent(csrfMatch[2]) : '';
                if (csrfToken) {
                    const csrfField = document.createElement('input');
                    csrfField.type = 'hidden';
                    csrfField.name = '_csrf';
                    csrfField.value = csrfToken;
                    form.appendChild(csrfField);
                }
                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);
                fileListIframe.style.display = 'block';
                fileListVisible = true;
            } else {
                // 隐藏文件列表
                fileListIframe.style.display = 'none';
                fileListVisible = false;
            }
        });
    </script>
</body>

</html>
{{end}}
