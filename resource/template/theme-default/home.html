{{define "theme-default/home"}}
{{template "theme-default/header" .}}
{{if ts .CustomCode}} {{.CustomCode|safe}} {{end}}
{{template "theme-default/menu" .}}
<div class="nb-container refined-home-page">
    <div class="ui container">
        <template v-if="groups">
            <div class="ui styled fluid accordion" v-for="group in groups">
                <div class="active title">
                    <i class="dropdown icon"></i>
                    @#(group.Tag!==''?group.Tag:'{{tr "Default"}}')#@
                </div>
                <div class="active content">
                    <!-- The compact view is intentionally a real monitoring table,
                         rather than stretched cards. Cards remain available through
                         the layout selector above. -->
                    <div class="refined-server-list" aria-label="服务器列表">
                        <div class="refined-server-list__scroll">
                            <div class="refined-server-list__head">
                                <span>状态</span><span>名称</span><span>系统</span><span>位置</span><span>在线</span><span>负载</span><span>网速 ↓ / ↑</span><span>流量 ↓ / ↑</span><span>CPU</span><span>内存</span><span>硬盘</span>
                            </div>
                            <div v-for="server in group.data" :key="`list-${server.ID}`" class="refined-server-list__row" :class="{ 'is-offline': !server.live }" v-if="server.Host" role="link" tabindex="0" @click="openServerDetail(server.ID)" @keydown.enter="openServerDetail(server.ID)">
                                <span class="refined-list-status" :class="{ 'is-live': server.live }" :title="server.live ? '在线' : '离线'"></span>
                                <span class="refined-list-name">
                                    <i v-if="server.Host.CountryCode" :class="'fi fi-' + server.Host.CountryCode"></i>
                                    <span>@#server.Name#@</span>
                                    <small v-if="!server.live">[{{tr "Offline"}}]</small>
                                </span>
                                <span class="refined-list-system">@#server.Host.Platform || '-'#@</span>
                                <span class="refined-list-location"><i v-if="server.Host.CountryCode" :class="'fi fi-' + server.Host.CountryCode"></i>@#server.Host.CountryCode ? server.Host.CountryCode.toUpperCase() : '-'#@</span>
                                <span>@#secondToDate(server.State.Uptime)#@</span>
                                <span>@#toFixed2(server.State.Load1)#@</span>
                                <span class="refined-list-pair">@#formatByteSize(server.State.NetInSpeed)#@/s <b>/</b> @#formatByteSize(server.State.NetOutSpeed)#@/s</span>
                                <span class="refined-list-pair">@#formatByteSize(server.State.NetInTransfer)#@ <b>/</b> @#formatByteSize(server.State.NetOutTransfer)#@</span>
                                <span :class="formatPercent(server.live,server.State.CPU, 100).class + ' refined-list-progress'"><i :style="formatPercent(server.live,server.State.CPU, 100).style"></i><small>@#parseInt(server.State.CPU?server.State.CPU:0)#@%</small></span>
                                <span :class="formatPercent(server.live,server.State.MemUsed, server.Host.MemTotal).class + ' refined-list-progress'"><i :style="formatPercent(server.live,server.State.MemUsed, server.Host.MemTotal).style"></i><small>@#parseInt(server.Host.MemTotal?server.State.MemUsed/server.Host.MemTotal*100:0)#@%</small></span>
                                <span :class="formatPercent(server.live,server.State.DiskUsed, server.Host.DiskTotal).class + ' refined-list-progress'"><i :style="formatPercent(server.live,server.State.DiskUsed, server.Host.DiskTotal).style"></i><small>@#parseInt(server.Host.DiskTotal?server.State.DiskUsed/server.Host.DiskTotal*100:0)#@%</small></span>
                            </div>
                        </div>
                    </div>
                    <div class="ui four stackable status cards">
                        <div v-for="server in group.data" :id="server.ID" class="ui card refined-server-card-link" role="link" tabindex="0" @click="openServerDetail(server.ID)" @keydown.enter="openServerDetail(server.ID)">
                            <div class="content" v-if="server.Host" style="margin-top: 10px; padding-bottom: 5px">
                                <div class="header">
                                    <span class="refined-server-title">
                                        <i v-if="server.Host.CountryCode" :class="'fi fi-' + server.Host.CountryCode"></i>
                                        <template v-if="shouldShowPlatformLogo(server.Host.Platform)">
                                            <i v-if='isWindowsPlatform(server.Host.Platform)' class="windows icon"></i>
                                            <i v-else-if='getFontLogoClass(server.Host.Platform) == "" && server.State.Uptime > 0' class="fl-tux"></i>
                                            <i v-else :class="'fl-' + getFontLogoClass(server.Host.Platform)"></i>
                                        </template>
                                        <span class="refined-server-name">@#server.Name + (server.live?'':'[{{tr "Offline"}}]')#@</span>
                                    </span>
                                    <div class="ui divider" style="margin-bottom: 5px"></div>
                                </div>
                                <div class="description">
                                    <div class="ui grid">
                                        <div class="three wide column">CPU</div>
                                        <div class="thirteen wide column">
                                            <div :class="formatPercent(server.live,server.State.CPU, 100).class">
                                                <div class="bar" :style="formatPercent(server.live,server.State.CPU, 100).style">
                                                    <small>@#parseInt(server.State.CPU?server.State.CPU:0)#@%</small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="three wide column">{{tr "MemUsed"}}</div>
                                        <div class="thirteen wide column">
                                            <div :class="formatPercent(server.live,server.State.MemUsed, server.Host.MemTotal).class">
                                                <div class="bar" :style="formatPercent(server.live,server.State.MemUsed, server.Host.MemTotal).style">
                                                    <small>@#parseInt(server.Host.MemTotal?server.State.MemUsed/server.Host.MemTotal*100:0)#@%</small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="three wide column">{{tr "SwapUsed"}}</div>
                                        <div class="thirteen wide column">
                                            <div :class="formatPercent(server.live,server.State.SwapUsed, server.Host.SwapTotal).class">
                                                <div class="bar" :style="formatPercent(server.live,server.State.SwapUsed, server.Host.SwapTotal).style">          
                                                    <small v-if="server.Host.SwapTotal === 0">OFF</small>
                                                    <small v-else>@#parseInt(server.State.SwapUsed/server.Host.SwapTotal*100)#@%</small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="three wide column">{{tr "DiskUsed"}}</div>
                                        <div class="thirteen wide column">
                                            <div :class="formatPercent(server.live,server.State.DiskUsed, server.Host.DiskTotal).class">
                                                <div class="bar" :style="formatPercent(server.live,server.State.DiskUsed, server.Host.DiskTotal).style">
                                                    <small>@#parseInt(server.Host.DiskTotal?server.State.DiskUsed/server.Host.DiskTotal*100:0)#@%</small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="three wide column">{{tr "NetSpeed"}}</div>
                                        <div class="thirteen wide column">
                                            <div class="refined-metrics refined-metrics--two">
                                                <span class="refined-metric"><i class="arrow alternate circle down outline icon"></i><span>@#formatByteSize(server.State.NetInSpeed)#@/s</span></span>
                                                <span class="refined-metric"><i class="arrow alternate circle up outline icon"></i><span>@#formatByteSize(server.State.NetOutSpeed)#@/s</span></span>
                                            </div>
                                        </div>
                                        <div class="three wide column">{{tr "NetTransfer"}}</div>
                                        <div class="thirteen wide column">
                                            <div class="refined-metrics refined-metrics--two">
                                                <span class="refined-metric"><i class="arrow circle down icon"></i><span>@#formatByteSize(server.State.NetInTransfer)#@</span></span>
                                                <span class="refined-metric"><i class="arrow circle up icon"></i><span>@#formatByteSize(server.State.NetOutTransfer)#@</span></span>
                                            </div>
                                        </div>
                                        <div class="three wide column">{{tr "Stat"}}</div>
                                        <div class="thirteen wide column">
                                            <div class="refined-metrics refined-metrics--three">
                                                <span class="refined-metric"><i class="bi bi-cpu-fill" style="font-size: 1.1rem; color: #4a86e8;"></i><span>@#getCoreAndGHz(server.Host.CPU) || '—'#@</span></span>
                                                <span class="refined-metric"><i class="bi bi-memory" style="font-size: 1.1rem; color: #00ac0d;"></i><span>@#getK2Gb(server.Host.MemTotal)#@</span></span>
                                                <span class="refined-metric"><i class="bi bi-hdd" style="font-size: 1.1rem; color: #e41e10"></i><span>@#getK2Gb(server.Host.DiskTotal)#@</span></span>
                                            </div>
                                        </div>
                                        <div class="three wide column">{{tr "Load"}}</div>
                                        <div class="thirteen wide column">
                                            <div class="refined-metrics refined-metrics--one">
                                                <span class="refined-metric"><i class="bi bi-activity" style="font-size: 1.1rem; color: #e41e10;"></i><span>@#toFixed2(server.State.Load1)#@ | @#toFixed2(server.State.Load5)#@ | @#toFixed2(server.State.Load15)#@</span></span>
                                            </div>
                                        </div>
                                        <div class="three wide column">{{tr "Uptime"}}</div>
                                        <div class="thirteen wide column">
                                            <div class="refined-metrics refined-metrics--one">
                                                <span class="refined-metric"><i class="clock icon"></i><span>@#secondToDate(server.State.Uptime)#@</span></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="content" v-else>
                                <p>@#server.Name#@</p>
                                <p>{{tr "ServerIsOffline"}}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
{{template "theme-default/footer" .}}
<script>
    var statusCards = new Vue({
        el: '#app',
        delimiters: ['@#', '#@'],
        data: {
            page: 'index',
            defaultTemplate: {{.Conf.Site.Theme }},
            templates: {{.Themes }},
            servers: [],
            groups: [],
            cache: [],
            chartDataList: [],
            activePopup: null,
            sensorList: [
                'TC0D', //CPU Die 温度，代表 CPU 内部的温度
                'TC0H', //CPU Heatsink 温度，代表 CPU 散热器的温度
                'TC0P', //CPU Proximity 温度，代表 CPU 附近的温度
                'k10temp', //AMD K10（Phenom、Athlon、Sempron 等）系列处理器的温度监测
                'k10temp_tctl', //AMD K10 (Athlon II、Phenom II 等）系列处理器的温度监测
                'coretemp_package_id_0', //整个封装处理器温度
                'cpu_thermal_zone', //全志
                'cpu-thermal', //树莓派(博通)
                'soc_thermal', //新瑞芯微
                'cpu_thermal', //老瑞芯微
                'ACPI\\ThermalZone\\TZ0__0', //Windows
                'ACPI\\ThermalZone\\CPUZ_0', //Windows
                'ACPI\\ThermalZone\\TZ00_0', //Windows
                'ACPI\\ThermalZone\\TZ001_0', //Windows
                'ACPI\\ThermalZone\\THM0_0' //Windows
            ]
        },
        mixins: [mixinsVue],
        created() {
            this.servers = JSON.parse('{{.Servers}}').servers;
            this.group()
        },
        methods: {
            openServerDetail(id) {
                window.location.href = '/server/' + id;
            },
            togglePopup(event, id) {
                // 切换弹出层的激活状态
                this.activePopup = this.activePopup === id ? null : id;
                this.showCharts(id);
            },
            isActive(id) {
                // 检查弹出层是否处于激活状态
                return this.activePopup === id;
            },
            closePopup(id) {
                this.activePopup = null;
            },
            showCharts(id) {
                // 发起数据请求
                const url = `/api/v1/monitor/${id}`;
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data.result) { // 数据请求成功，更新数据并渲染图表
                            this.chartDataList[id - 1] = data.result;
                            this.$nextTick(() => {
                                this.renderCharts(id);
                            });
                        } else {
                            console.log('this agent (id:' + id + ') has no monitor.');
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching data:', error);
                    });
            },
            renderCharts(id) {
                if (!this.chartDataList[id - 1]) return;
                const MaxTCPPingValue = {{.Conf.MaxTCPPingValue }} ? {{.Conf.MaxTCPPingValue }} : 300;
                const isMobile = this.checkIsMobile();
                const fontSize = isMobile ? 10 : 9;
                const itemGap = isMobile ? 6 : 6;
                const itemWidth = isMobile ? 10 : 10;
                const itemHeight = isMobile ? 10 : 10;
                const gridLeft = 25;
                const gridRight = 12;
                const backgroundColor = '';
                const rootStyle = getComputedStyle(document.documentElement);
                const chartText = rootStyle.getPropertyValue('--nz-text').trim() || '#171717';
                const chartTextSoft = rootStyle.getPropertyValue('--nz-text-soft').trim() || '#777777';
                const chartBorder = rootStyle.getPropertyValue('--nz-border').trim() || '#e4e4e1';
                const chartSurface = rootStyle.getPropertyValue('--nz-surface-raised').trim() || '#ffffff';
                const chartDark = $('html').attr('nz-theme') == "dark";
                const chartColors = chartDark
                    ? ['#f3f3f3', '#c7c7c7', '#9f9f9f', '#7b7b7b', '#5e5e5e']
                    : ['#171717', '#444444', '#686868', '#8b8b8b', '#adadad'];
                const chartData = this.chartDataList[id - 1];
                const chartContainer = this.$refs[`chart${id}`][0];
                const chartTheme = $('html').attr('nz-theme') == "dark" ? "dark" : "";
                const chart = echarts.init(chartContainer, chartTheme, {
                    renderer: 'canvas',
                    useDirtyRect: false,
                    width: 'auto',
                    height: 120,
                });
                const xAxisData = chartData[0].created_at.map(time => new Date(time).toLocaleString());
                const seriesData = chartData.map(item => {
                    let loss = 0;
                    const data = item.avg_delay.map((avgDelay, index) => {
                        if (avgDelay > 0 && avgDelay < MaxTCPPingValue) {
                            loss += avgDelay > 0.9 * MaxTCPPingValue ? 1 : 0;
                            return [item.created_at[index], avgDelay];
                        } else {
                            loss += 1;
                        }
                    });
                    const lossRate = ((loss / item.created_at.length) * 100).toFixed(1);
                    item.monitor_name = item.monitor_name.includes("%") ? item.monitor_name : `${item.monitor_name} ${lossRate}%`;
                    return {
                        name: item.monitor_name,
                        type: 'line',
                        smooth: true,
                        symbol: 'none',
                        data: data,
                        connectNulls: true
                    };
                });
                const option = {
                    color: chartColors,
                    backgroundColor: backgroundColor,
                    title: {
                        show: false
                    },
                    tooltip: {
                        show: true,
                        trigger: 'axis',
                        borderWidth: 1,
                        borderColor: chartBorder,
                        backgroundColor: chartSurface,
                        textStyle: {
                            color: chartText,
                            fontSize: fontSize,
                        },
                        extraCssText: 'border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.12);'
                    },
                    legend: {
                        icon: 'rect',
                        data: chartData.map(item => item.monitor_name),
                        show: true,
                        textStyle: {
                            color: chartTextSoft,
                            fontSize: fontSize,
                        },
                        lineStyle: {
                            cap: 'butt'
                        },
                        top: 0,
                        bottom: 0,
                        itemGap: itemGap,
                        itemWidth: itemWidth,
                        itemHeight: itemHeight,
                        padding: [5, 0, 5, 0]
                    },
                    xAxis: {
                        type: 'time',
                        data: xAxisData,
                        axisLabel: {
                            color: chartTextSoft,
                            textStyle: {
                                fontSize: fontSize
                            }
                        },
                        axisLine: { lineStyle: { color: chartBorder } },
                        axisTick: { lineStyle: { color: chartBorder } },
                        splitLine: { lineStyle: { color: chartBorder } }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: {
                            color: chartTextSoft,
                            textStyle: {
                                fontSize: fontSize
                            }
                        },
                        axisLine: { lineStyle: { color: chartBorder } },
                        axisTick: { lineStyle: { color: chartBorder } },
                        splitLine: { lineStyle: { color: chartBorder } }
                    },
                    dataZoom: [
                        {
                            show: false,
                            type: 'slider',
                            start: 0,
                            end: 100
                        }
                    ],
                    series: seriesData,
                    textStyle: {
                        color: chartText,
                        fontSize: fontSize,
                    },
                    grid: {
                        top: '30',
                        bottom: '20',
                        left: gridLeft,
                        right: gridRight
                    }
                };
                chart.setOption(option);
            },
            checkIsMobile() { // 检测设备类型,页面宽度小于768px认为是移动设备
                return window.innerWidth <= 768;
            },
            toFixed2(f) {
                return f.toFixed(2)
            },
            isWindowsPlatform(str) {
                return str.includes('Windows')
            },
            shouldShowPlatformLogo(str) {
                return this.getFontLogoClass(str) !== 'apple'
            },
            getFontLogoClass(str) {
                if (["almalinux",
                    "alpine",
                    "aosc",
                    "apple",
                    "archlinux",
                    "archlabs",
                    "artix",
                    "budgie",
                    "centos",
                    "coreos",
                    "debian",
                    "deepin",
                    "devuan",
                    "docker",
                    "elementary",
                    "fedora",
                    "ferris",
                    "flathub",
                    "freebsd",
                    "gentoo",
                    "gnu-guix",
                    "illumos",
                    "kali-linux",
                    "linuxmint",
                    "mageia",
                    "mandriva",
                    "manjaro",
                    "nixos",
                    "openbsd",
                    "opensuse",
                    "pop-os",
                    "raspberry-pi",
                    "redhat",
                    "rocky-linux",
                    "sabayon",
                    "slackware",
                    "snappy",
                    "solus",
                    "tux",
                    "ubuntu",
                    "void",
                    "zorin"].indexOf(str)
                    > -1) {
                    return str;
                }
                if (str == 'darwin') {
                    return 'apple';
                }
                if (['openwrt', 'linux'].indexOf(str) > -1) {
                    return 'tux';
                }
                if (str == 'amazon') {
                    return 'redhat';
                }
                if (str == 'arch') {
                    return 'archlinux';
                }
                if (str.toLowerCase().includes('opensuse')) {
                    return 'opensuse';
                }
                return '';
            },
            group() {
                this.groups = groupingData(this.servers, "Tag")
            },
            formatPercent(live, used, total) {
                const percent = live ? (parseInt(used / total * 100) || 0) : -1
                if (!this.cache[percent]) {
                    this.cache[percent] = {
                        class: {
                            ui: true,
                            progress: true,
                        },
                        style: {
                            'transition-duration': '300ms',
                            'min-width': 'unset',
                            width: percent + '% !important',
                        },
                        percent,
                    }
                    if (percent < 0) {
                        this.cache[percent].style['background-color'] = 'slategray'
                        this.cache[percent].class.offline = true
                        if (!live) {
                            this.cache[percent].percent = 0
                        }
                    } else if (percent < 51) {
                        this.cache[percent].style['background-color'] = '#0a94f2'
                        this.cache[percent].class.fine = true
                    } else if (percent < 81) {
                        this.cache[percent].style['background-color'] = 'orange'
                        this.cache[percent].class.warning = true
                    } else {
                        this.cache[percent].style['background-color'] = 'crimson'
                        this.cache[percent].class.error = true
                    }
                }
                return this.cache[percent]
            },
            secondToDate(s) {
                var d = Math.floor(s / 3600 / 24);
                if (d > 0) {
                    return d + " {{tr "Day"}}"
                }
                var h = Math.floor(s / 3600 % 24);
                var m = Math.floor(s / 60 % 60);
                var s = Math.floor(s % 60);
                return h + ":" + ("0" + m).slice(-2) + ":" + ("0" + s).slice(-2);
            },
            formatTimestamp(t) {
                return new Date(t * 1000).toLocaleString()
            },
            formatByteSize(bs) {
                const x = this.readableBytes(bs)
                return x != "NaN undefined" ? x : '0B'
            },
            readableBytes(bytes) {
                if (!bytes) {
                    return '0B'
                }
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                const sizes = ["B", "K", "M", "G", "T", "P", "E", "Z", "Y"];
                return parseFloat((bytes / Math.pow(1024, i)).toFixed(2)) + sizes[i];
            },
            getCoreAndGHz(arr) {
                if ((arr || []).length === 0) {
                    return '';
                }
                let totalCores = 0;
                arr.forEach(str => {
                    let coreMatch = str.match(/(\d+(\.\d+)?) Physical/g);
                    let coreCount = 0;
                    if (coreMatch) {
                        coreCount = parseFloat(coreMatch[0]);
                    } else {
                        let coreMatch = str.match(/(\d+(\.\d+)?) Virtual/g);
                        coreCount = coreMatch ? parseFloat(coreMatch[0]) : 0;
                    }
                    totalCores += coreCount;
                });
                return `${totalCores} Cores`;
            },
            getK2Gb(bs){
                bs = bs / 1024 / 1024 / 1024;
                if (bs >= 1) {
                    return Math.ceil(bs.toFixed(2)) + 'GB';
                } else {
                    bs = bs * 1024;
                    return Math.ceil(bs.toFixed(2)) + 'MB';
                }
            },
            listTipsMouseenter(obj, strs, tipsNum = 1){
                this.layerIndex = layer.tips(strs, '#' + obj, { tips: [tipsNum, 'rgb(0 0 0 / 85%)'], time: 0 });
                $('#' + obj).attr('layerIndex', this.layerIndex)
            },
            listTipsMouseleave(obj){
                layer.close(this.layerIndex)
            },
            toggleDetailedTemp(id){
                const tempDom = document.getElementById(`temp-${id}`); 
                const tempDetailShow = tempDom.getAttribute('temp-detail-show');
                const tempMain = document.getElementById(`temp-main-${id}`); 
                const tempDetail = document.getElementById(`temp-detail-${id}`); 
                if (tempDetailShow == 0){
                    tempMain.style.display = 'none';
                    tempDetail.style.display = 'inline';
                    tempDom.setAttribute('temp-detail-show', 1);
                } else {
                    tempMain.style.display = 'inline';
                    tempDetail.style.display = 'none';
                    tempDom.setAttribute('temp-detail-show', 0);
                }
            },
            getTemperature(temperatureList, sensorList) {
                // 将 sensorList 中的所有项转换为小写
                const lowerCaseSensorList = sensorList.map(sensor => sensor.toLowerCase());

                // 合并过滤逻辑：过滤出 Temperature 不为 0 且 Name 在 sensorList 中的元素（忽略大小写）
                const filtered = temperatureList.filter(item => item.Temperature !== 0 && lowerCaseSensorList.includes(item.Name.toLowerCase()));
                //console.log('filtered:',filtered);
                
                // 如果有匹配的元素，则计算这些元素的 Temperature 的最大值
                if (filtered.length > 0) {
                    return filtered.reduce((max, current) => {
                        return current.Temperature > max ? current.Temperature : max;
                    }, filtered[0].Temperature);
                }

                // 如果没有匹配的元素，则计算 temperatureList 中所有 Temperature 不为 0 的元素的最大值
                const nonZeroTemps = temperatureList.filter(item => item.Temperature !== 0);
                //console.log('nonZeroTemps:',nonZeroTemps);

                if (nonZeroTemps.length > 0) {
                    return nonZeroTemps.reduce((max, current) => {
                        return current.Temperature > max ? current.Temperature : max;
                    }, nonZeroTemps[0].Temperature);
                }

                // 如果所有元素的 Temperature 都为 0，则返回一个默认值 0
                return 0;
            }
        }
    })
  
    function groupingData(data, field) {
        let map = {};
        let dest = [];
        data.forEach(item => {
            if (!map[item[field]]) {
                    dest.push({
                    [field]: item[field],
                    data: [item]
                });
                map[item[field]] = item;
            } else {
                dest.forEach(dItem => {
                    if (dItem[field] == item[field]) {
                        dItem.data.push(item);
                    }
                });
            }
        })
        return dest;
    }
  
    let canShowError = true;
    function connect() {
        const wsProtocol = window.location.protocol == "https:" ? "wss" : "ws"
        const ws = new WebSocket(wsProtocol + '://' + window.location.host + '/ws');
        ws.onopen = function (evt) {
            canShowError = true;
            $.suiAlert({
                title: '{{tr "RealtimeChannelEstablished"}}',
                description: '{{tr "GetTheLatestMonitoringDataInRealTime"}}',
                type: 'success',
                time: '2',
                position: 'top-center',
            });
        }
        ws.onmessage = function (evt) {
            const oldServers = statusCards.servers
            const data = JSON.parse(evt.data)
            statusCards.servers = data.servers
            for (let i = 0; i < statusCards.servers.length; i++) {
                const ns = statusCards.servers[i];
                if (!ns.Host) {
                    ns.live = false
                } else {
                    const lastActive = new Date(ns.LastActive).getTime()
                    if (data.now - lastActive > 10 * 1000) {
                        ns.live = false
                    } else {
                        ns.live = true
                    }
                }
            }
            statusCards.groups = groupingData(statusCards.servers, "Tag")
        }
        ws.onclose = function () {
            if (canShowError) {
                canShowError = false;
                $.suiAlert({
                    title: '{{tr "RealtimeChannelDisconnect"}}',
                    description: '{{tr "CanNotGetTheLatestMonitoringDataInRealTime"}}',
                    type: 'warning',
                    time: '2',
                    position: 'top-center',
                });
            }
            setTimeout(function () {
                connect()
            }, 3000);
        }
        ws.onerror = function () {
            ws.close()
        }
    }
  
    connect();
  
    $('.ui.accordion').accordion({ "exclusive": false });
</script>
