{{define "theme-default/header"}}
<!DOCTYPE html>
<html lang="{{.Conf.Language}}">

<head>
    <title>{{ .Title }}</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta content="telephone=no" name="format-detection">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f6f6f5" />
    {{ if eq .Conf.Language "zh-CN" }}
        <link rel="manifest" href="/static/manifest-zh-CN.json?v20240905" />
    {{ else }}
        <link rel="manifest" href="/static/manifest-en-US.json?v20240905" />
    {{ end }}
    <link rel="apple-touch-startup-image" href="{{if .Conf.Site.LogoURL}}{{.Conf.Site.LogoURL}}{{else}}/static/refined/sun-logo.svg?v20260802{{end}}" />
    <link rel="shortcut icon" href="{{if .Conf.Site.LogoURL}}{{.Conf.Site.LogoURL}}{{else}}/static/refined/sun-logo.svg?v20260802{{end}}">
    <link rel="stylesheet" href="/static/cdn/semantic-ui@2.4.2/dist/semantic.min.css">
    <link rel="stylesheet" href="/static/cdn/font-logos@0.17.0/assets/font-logos.css">
    <link rel="stylesheet" href="/static/cdn/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/cdn/flag-icons@7.2.3/css/flag-icons.min.css">
    <link rel="stylesheet" type="text/css" href="/static/semantic-ui-alerts.min.css">
    <link rel="stylesheet" type="text/css" href="/static/theme-default/css/main.css?v20240816">
    <link rel="stylesheet" type="text/css" href="/static/darkmode.css?v20240816">
    <style>
        html {
            color-scheme: light;
        }

        html,
        body,
        body.pushable,
        body.pushable > .pusher,
        .pushable,
        .pushable > .pusher {
            background: #f6f6f5 !important;
        }

        .ui.sidebar {
            border-right: 0 !important;
            background: #ffffff !important;
            box-shadow: none !important;
        }

        .pushable > .pusher:after,
        .pushable > .pusher.dimmed:after,
        body.pushable > .pusher:after,
        body.pushable > .pusher.dimmed:after {
            background: rgba(246, 246, 245, 0.74) !important;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="/static/refined/refined.css?v20260802ah">
    {{if eq .MatchedPath "/"}}
    <script>
        window.__refinedLoaderStartedAt = Date.now();
        document.documentElement.classList.add('refined-loading');
        window.__refinedLoaderFallback = window.setTimeout(function () {
            document.documentElement.classList.remove('refined-loading');
        }, 8000);
    </script>
    {{end}}
    <script src="/static/cdn/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/static/cdn/semantic-ui@2.4.2/dist/semantic.min.js"></script>
    <script src="/static/cdn/vue@2.7.16/dist/vue.min.js"></script>
    <script src="/static/cdn/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="/static/semantic-ui-alerts.min.js"></script>
    {{if eq .MatchedPath "/"}}
    <script src="/static/refined/refined-loader.js?v20260728c"></script>
    {{end}}
    <script src="/static/theme-default/js/mixin.js?v20240911"></script>
    <script>
        (function () {
            var storageKey = 'nezha-refined-color-scheme';
            var savedTheme = null;
            try {
                savedTheme = window.localStorage.getItem(storageKey);
            } catch (_) {}
            var theme = savedTheme === 'dark' || savedTheme === 'light'
                ? savedTheme
                : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('nz-theme', theme);
            window.toggleRefinedColorScheme = function () {
                var nextTheme = document.documentElement.getAttribute('nz-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('nz-theme', nextTheme);
                try {
                    window.localStorage.setItem(storageKey, nextTheme);
                } catch (_) {}
                window.dispatchEvent(new CustomEvent('refined-theme-change', { detail: { theme: nextTheme } }));
            };
            window.applyRefinedLayout = function () {
                var savedLayout = null;
                try {
                    savedLayout = window.localStorage.getItem('nezha-refined-layout');
                } catch (_) {}
                var layout = savedLayout === 'list' ? 'list' : 'grid';
                var app = document.getElementById('app');
                if (app) app.setAttribute('data-refined-layout', layout);
                var control = document.getElementById('refined-layout-' + layout);
                if (control) control.checked = true;
                return layout;
            };
            window.setRefinedLayout = function (layout, navigateHome) {
                var nextLayout = layout === 'list' ? 'list' : 'grid';
                try {
                    window.localStorage.setItem('nezha-refined-layout', nextLayout);
                } catch (_) {}
                var app = document.getElementById('app');
                if (app) app.setAttribute('data-refined-layout', nextLayout);
                var control = document.getElementById('refined-layout-' + nextLayout);
                if (control) control.checked = true;
                if (navigateHome) window.location.href = '/';
            };
            document.addEventListener('DOMContentLoaded', window.applyRefinedLayout);
        })();
    </script>
</head>

<body>
    {{if eq .MatchedPath "/"}}
    <div id="refined-page-loader" class="refined-page-loader" role="status" aria-live="polite"
        aria-label="{{if eq .Conf.Language "zh-CN"}}正在加载{{else}}Loading{{end}}">
        <div class="refined-typing-indicator" aria-hidden="true">
            <span class="refined-typing-circle"></span>
            <span class="refined-typing-circle"></span>
            <span class="refined-typing-circle"></span>
            <span class="refined-typing-shadow"></span>
            <span class="refined-typing-shadow"></span>
            <span class="refined-typing-shadow"></span>
        </div>
    </div>
    {{end}}
    {{end}}
